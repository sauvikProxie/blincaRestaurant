[package]
name = "blinca-restaurant"
version = "0.1.0"
description = "Blinca restaurant partner app"
authors = ["Blinca"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "blinca_restaurant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
# Auth requests to the Convex site URL, which sends no CORS headers.
# No `cookies` feature: the session travels as a bearer token.
# `unsafe-headers` lets the app drop the Origin header (see src/lib/convex/auth-http.ts).
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "unsafe-headers"] }
